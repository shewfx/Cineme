name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Real PostgreSQL for integration and migration tests; SQLite is not a substitute.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cineme
          POSTGRES_PASSWORD: ci-placeholder-not-a-secret
          POSTGRES_DB: cineme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cineme -d cineme"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://cineme:ci-placeholder-not-a-secret@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.19"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.5"
      - run: flutter pub get --enforce-lockfile
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      # The hosted PWA must build, and nothing server-side may end up in it.
      - run: >-
          flutter build web --release
          --dart-define=API_BASE_URL=same-origin
          --dart-define=SUPABASE_URL=https://ci-placeholder.supabase.co
          --dart-define=SUPABASE_PUBLISHABLE_KEY=sb_publishable_ci_placeholder
      - run: python3 ../infra/check_web_bundle.py build/web

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate local PostgreSQL definition
        run: docker compose -f infra/compose.yaml config --quiet
        env:
          POSTGRES_PASSWORD: ci-placeholder-not-a-secret
