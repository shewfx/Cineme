<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Replaced by `flutter build web --base-href`; the app is served from the site root. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=Edge">
  <!-- viewport-fit=cover lets the app draw under the notch and home indicator;
       Flutter reads env(safe-area-inset-*) into MediaQuery padding, so the app bars
       and bottom navigation keep their safe-area spacing. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Cinemé: one movie from your watchlist, tonight.">
  <meta name="theme-color" content="#1C1C1C">
  <meta name="color-scheme" content="dark">

  <!-- iOS: Add to Home Screen opens the app standalone, without Safari chrome. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Cinemé">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="icon" type="image/png" href="favicon.png">
  <title>Cinemé</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Same charcoal as AppColors.background so there is no white flash while
       the engine loads, and no rubber-band white on iOS overscroll. */
    html, body { margin: 0; height: 100%; background: #1C1C1C; overscroll-behavior: none; }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
