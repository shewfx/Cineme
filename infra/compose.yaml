# Local PostgreSQL for development and integration tests. No application tables at P0.
# Copy infra/.env.example to infra/.env and set a local-only password first.
name: cineme

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cineme
      POSTGRES_DB: cineme
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in infra/.env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cineme -d cineme"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
